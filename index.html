<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Revenue Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#F7F9FB; --panel:#FFFFFF; --ink:#18232F; --muted:#5B6B7C; --line:#DCE3EA;
  --over:#0E6E6E; --over-soft:#E2F1F0; --under:#A44A0B; --under-soft:#FBEADC;
  --input:#1F4FD1; --focus:#1F4FD1; --target-bg:#EEF2F7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --panel:#18212B; --ink:#E6ECF2; --muted:#93A3B4; --line:#2A3644;
    --over:#4FC3B9; --over-soft:#173332; --under:#F0A266; --under-soft:#3A2618;
    --input:#8FB0FF; --focus:#8FB0FF; --target-bg:#1E2935; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --panel:#18212B; --ink:#E6ECF2; --muted:#93A3B4; --line:#2A3644;
  --over:#4FC3B9; --over-soft:#173332; --under:#F0A266; --under-soft:#3A2618;
  --input:#8FB0FF; --focus:#8FB0FF; --target-bg:#1E2935; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
h1{font-family:"IBM Plex Serif",Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 24px;max-width:68ch}
.top{display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-end;margin-bottom:22px}
.next{display:flex;flex-direction:column}
.next .k{color:var(--muted);font-size:13px}
.next .v{font-family:"IBM Plex Serif",Georgia,serif;font-size:clamp(30px,5vw,44px);line-height:1.1;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:20px 32px;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.base{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 14px 6px;margin-bottom:18px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin:2px 4px 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:1340px;table-layout:fixed;font-variant-numeric:tabular-nums}
table col.lab{width:124px}
th,td{padding:0;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
thead th{font-weight:500;font-size:13px;color:var(--muted);padding:10px 10px;background:var(--panel)}
tbody th{text-align:left;font-weight:600;font-size:14px;padding:10px 14px;position:sticky;left:0;background:var(--panel);z-index:1;min-width:112px}
tr:last-child th,tr:last-child td{border-bottom:none}
tr.target td,tr.target th{background:var(--target-bg)}
td .calc{display:block;padding:10px 10px;font-weight:600}
input.num{width:100%;min-width:0;border:0;background:transparent;font:inherit;color:var(--input);text-align:right;padding:10px 10px;font-variant-numeric:tabular-nums}
input.num::placeholder{color:var(--line)}
input.num[readonly]{color:var(--ink);cursor:default}
.base input.num[readonly]{border-color:transparent;background:transparent;padding-left:0;text-align:left;width:auto}
input.num[readonly]:focus{outline:none}
input.num:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--panel)}
.base input.num{width:130px;min-width:0;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--panel)}
td.over{background:var(--over-soft)} td.under{background:var(--under-soft)}
td.warn input{outline:1px dashed var(--under);outline-offset:-3px}
.bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 0}
.status{font-size:14px;color:var(--muted)}
.status.dirty{color:var(--under)}
button{font:inherit;font-weight:500;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin-top:18px;max-width:80ch}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-110%);display:none;font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
.keybox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.keybox input{font:inherit;flex:1 1 260px;min-width:0;border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--bg);color:var(--ink)}
.keybox p{margin:0;flex-basis:100%;color:var(--muted);font-size:13px}
.lock{max-width:340px;margin:12vh auto 0;padding:28px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;text-align:center}
.lock h1{margin-bottom:6px}
.lock p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lock input{font:inherit;font-size:28px;letter-spacing:.5em;text-align:center;width:100%;padding:10px 0 10px .5em;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.lock input:focus{outline:2px solid var(--focus);outline-offset:1px}
.lock button{width:100%;margin-top:12px}
.lock .err{color:var(--under);min-height:1.5em;margin:10px 0 0;font-size:14px}
.pinrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keybox .pinrow input{flex:0 0 110px}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="lockwrap" hidden></div>
<div class="wrap" id="app"></div>
<script type="application/json" id="state">{"base":2500000,"janTarget":2500000,"more":[null,null,null,null,null,null,null,null,null,null,null,null],"less":[null,null,null,null,null,null,null,null,null,null,null,null],"updated":null}</script>
<script id="app-script">
(function(){
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const SHORT=MONTHS.map(m=>m.slice(0,3));
  let saved=JSON.parse(document.getElementById("state").textContent);
  let state=JSON.parse(JSON.stringify(saved));
  const editing=location.hash==="#edit";
  const REPO="lokiheed/revenue-tracker-2027", DATA_PATH="data.json", KEY_STORE="rt2027-gh-key";
  let savedJSON=JSON.stringify(saved), saving=false, loading=true, msg="";
  let pin=null, pendingPin=null, encPayload=null, pinOpen=false;
  const PIN_STORE="rt2027-pin", ITER=600000;
  const getKey=()=>{try{return localStorage.getItem(KEY_STORE)||"";}catch(e){return "";}};
  const setKey=k=>{try{k?localStorage.setItem(KEY_STORE,k):localStorage.removeItem(KEY_STORE);}catch(e){}};
  window.addEventListener("hashchange",()=>location.reload());

  const fmt=n=>n==null||n===""||isNaN(n)?"":Math.round(n).toLocaleString("en-US");
  const parse=s=>{const t=String(s).replace(/[^0-9.\-]/g,"");if(t===""||t==="-")return null;const n=Number(t);return isNaN(n)?null:n;};

  function targets(){
    const b=state.base, t=[state.janTarget];
    for(let i=1;i<12;i++){
      const m=state.more[i-1], l=state.less[i-1];
      if(m!=null) t.push(b-(m-b));
      else if(l!=null) t.push(b+(b-l));
      else t.push(null);
    }
    return t;
  }
  function billed(i){return state.more[i]!=null?state.more[i]:state.less[i];}

  const app=document.getElementById("app");
  app.innerHTML=`
    <h1>2027 Revenue Tracker</h1>
    <p class="lede">${editing?"Enter each month’s billed amount in Billed More (at or above the base target) or Billed Less (below it). Next month’s target updates automatically, and Save publishes the numbers.":"Monthly billing against target for 2027. Each month’s target is adjusted by how much the previous month billed above or below the base target."}</p>
    <p class="lede" id="updated" style="margin-top:-16px"></p>
    <div class="top">
      <div class="next"><span class="k" id="nextLabel">Next target</span><span class="v" id="nextVal">—</span></div>
      <div class="facts">
        <span>Billed so far <b id="ytd">—</b></span>
        <span>Months at or above base <b id="hit">—</b></span>
        <span>Months below base <b id="miss">—</b></span>
      </div>
      <label class="base">Base target <input class="num" id="base" inputmode="numeric" aria-label="Base monthly target"></label>
    </div>
    ${editing?`<div class="keybox" id="keybox"></div><div class="keybox" id="pinbox"></div>`:""}
    <div class="chart">
      <div class="legend"><span><i style="background:var(--over)"></i>Billed at or above base</span><span><i style="background:var(--under)"></i>Billed below base</span><span><i style="background:var(--muted);height:2px;vertical-align:3px"></i>Target</span></div>
      <div class="chartwrap"><svg id="chart" role="img" aria-label="Billed amount versus target by month"></svg><div class="tip" id="tip"></div></div>
    </div>
    <div class="tablebox">
      <table>
        <colgroup><col class="lab">${MONTHS.map(()=>"<col>").join("")}</colgroup>
        <thead><tr><th></th>${MONTHS.map(m=>`<th scope="col">${m}</th>`).join("")}</tr></thead>
        <tbody>
          <tr class="more"><th scope="row">Billed More</th>${MONTHS.map((m,i)=>`<td data-r="more" data-i="${i}"><input class="num" inputmode="numeric" placeholder="—" aria-label="${m} billed more"></td>`).join("")}</tr>
          <tr class="target"><th scope="row">Target</th>${MONTHS.map((m,i)=>i===0?`<td><input class="num" id="jan" inputmode="numeric" aria-label="January target"></td>`:`<td><span class="calc" data-t="${i}">—</span></td>`).join("")}</tr>
          <tr class="less"><th scope="row">Billed Less</th>${MONTHS.map((m,i)=>`<td data-r="less" data-i="${i}"><input class="num" inputmode="numeric" placeholder="—" aria-label="${m} billed less"></td>`).join("")}</tr>
        </tbody>
      </table>
    </div>
    <div class="bar" ${editing?"":"hidden"}>
      <span class="status" id="status"></span>
      <span><button id="discard">Discard changes</button> <button class="primary" id="save">Save</button></span>
    </div>
    <p class="note">Rule: if a month bills more than the base, next target = base − (Billed More − base). If it bills less, next target = base + (base − Billed Less). Each month compares against the base target, not the adjusted target. ${editing?"A dashed cell means a number looks like it’s in the wrong row; it still calculates the same way.":""}</p>`;

  const baseIn=document.getElementById("base"), janIn=document.getElementById("jan");
  function fillInputs(){
    baseIn.value=fmt(state.base); janIn.value=fmt(state.janTarget);
    document.querySelectorAll("td[data-r]").forEach(td=>{td.querySelector("input").value=fmt(state[td.dataset.r][+td.dataset.i]);});
  }
  function render(){
    const t=targets(), b=state.base;
    document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=fmt(t[+el.dataset.t])||"—";});
    document.querySelectorAll("td[data-r]").forEach(td=>{
      const r=td.dataset.r,i=+td.dataset.i,v=state[r][i];
      td.classList.toggle("over",r==="more"&&v!=null);
      td.classList.toggle("under",r==="less"&&v!=null);
      const wrong=(r==="more"&&v!=null&&v<b)||(r==="less"&&v!=null&&v>=b)||(r==="less"&&v!=null&&state.more[i]!=null);
      td.classList.toggle("warn",!!wrong);
      td.title=r==="less"&&v!=null&&state.more[i]!=null?"Billed More is also filled for this month; Billed More is used.":(wrong?"This amount looks like it belongs in the other row.":"");
    });
    let ytd=0,hit=0,miss=0,last=-1;
    for(let i=0;i<12;i++){const v=billed(i);if(v!=null){ytd+=v;last=i;if(v>=b)hit++;else miss++;}}
    const filled=last>=0;
    document.getElementById("ytd").textContent=filled?fmt(ytd):"—";
    document.getElementById("hit").textContent=filled?hit:"—";
    document.getElementById("miss").textContent=filled?miss:"—";
    const ni=last+1;
    if(ni<12){document.getElementById("nextLabel").textContent=`${MONTHS[ni]} target`;document.getElementById("nextVal").textContent=fmt(t[ni])||"—";}
    else{document.getElementById("nextLabel").textContent="January 2028 target";const v=billed(11);document.getElementById("nextVal").textContent=fmt(state.more[11]!=null?b-(v-b):b+(b-v));}
    drawChart(t);
    const dirty=JSON.stringify(state)!==savedJSON||!!pendingPin;
    const st=document.getElementById("status");
    st.classList.toggle("dirty",dirty);
    st.textContent=msg||(loading?"Loading the latest numbers…":saving?"Saving…":dirty?"Unsaved changes":"All changes saved");
    document.getElementById("save").disabled=!dirty||saving||loading||!getKey()||!(pin||pendingPin);
    document.getElementById("discard").disabled=!dirty||saving;
    const u=document.getElementById("updated");
    u.textContent=state.updated?"Last updated "+new Date(state.updated).toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"}):"";
  }

  function drawChart(t){
    const svg=document.getElementById("chart"), W=Math.max(320,svg.parentNode.clientWidth||900), H=200, pl=8,pr=8,pt=10,pb=24;
    const vals=[];for(let i=0;i<12;i++){if(billed(i)!=null)vals.push(billed(i));if(t[i]!=null)vals.push(t[i]);}
    const max=Math.max(state.base*1.2,...vals,1);
    const cw=(W-pl-pr)/12, y=v=>pt+(H-pt-pb)*(1-v/max);
    let s="";
    const by=y(state.base);
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${by}" y2="${by}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    for(let i=0;i<12;i++){
      const x=pl+i*cw, v=billed(i), bw=Math.min(cw*0.5,44), bx=x+(cw-bw)/2;
      if(v!=null){const yy=y(Math.max(v,0));s+=`<rect x="${bx}" y="${yy}" width="${bw}" height="${Math.max(0,H-pb-yy)}" rx="2" fill="var(--${v>=state.base?"over":"under"})"/>`;}
      if(t[i]!=null){const ty=y(t[i]);s+=`<line x1="${x+cw*0.12}" x2="${x+cw*0.88}" y1="${ty}" y2="${ty}" stroke="var(--ink)" stroke-width="2"/>`;}
      s+=`<text x="${x+cw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans, Arial, sans-serif">${SHORT[i]}</text>`;
      s+=`<rect class="hit" data-i="${i}" x="${x}" y="0" width="${cw}" height="${H}" fill="transparent"/>`;
    }
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width","100%");svg.innerHTML=s;
    const tip=document.getElementById("tip");
    svg.querySelectorAll(".hit").forEach(r=>{
      r.addEventListener("mouseenter",()=>{const i=+r.dataset.i,v=billed(i);tip.textContent=`${MONTHS[i]}: target ${fmt(t[i])||"—"}, billed ${v!=null?fmt(v):"—"}`;tip.style.display="block";
        const rect=svg.getBoundingClientRect(),scale=rect.width/W;let left=(pl+i*cw+cw/2)*scale;const half=tip.offsetWidth/2;left=Math.min(Math.max(left,half),rect.width-half);tip.style.left=left+"px";tip.style.top="40px";});
      r.addEventListener("mouseleave",()=>{tip.style.display="none";});
    });
  }

  function bind(input,setter){
    input.addEventListener("input",()=>{setter(parse(input.value));render();});
    input.addEventListener("blur",()=>{const v=parse(input.value);input.value=fmt(v);});
  }
  bind(baseIn,v=>{state.base=v==null?0:v;});
  bind(janIn,v=>{state.janTarget=v;});
  document.querySelectorAll("td[data-r]").forEach(td=>bind(td.querySelector("input"),v=>{state[td.dataset.r][+td.dataset.i]=v;}));

  const b64enc=str=>{const by=new TextEncoder().encode(str);let bin="";for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);};
  const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
  const api=(path,opt={})=>fetch("https://api.github.com/repos/"+REPO+"/contents/"+path,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+getKey(),...(opt.headers||{})}});
  function clean(d){const z=a=>Array.from({length:12},(_,i)=>Array.isArray(a)&&typeof a[i]==="number"?a[i]:null);
    return {base:typeof d.base==="number"?d.base:2500000,janTarget:typeof d.janTarget==="number"?d.janTarget:null,more:z(d.more),less:z(d.less),updated:typeof d.updated==="string"?d.updated:null};}
  const u8b64=u=>{let s="";for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);};
  const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const isEnc=d=>d&&d.v===1&&typeof d.ct==="string";
  async function deriveKey(p,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
  async function encryptData(obj,p){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const k=await deriveKey(p,salt,ITER);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj))));
    return {v:1,kdf:"PBKDF2-SHA256",iter:ITER,salt:u8b64(salt),iv:u8b64(iv),ct:u8b64(ct)};}
  async function decryptData(env,p){const k=await deriveKey(p,b64u8(env.salt),env.iter||ITER);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(env.iv)},k,b64u8(env.ct));return JSON.parse(new TextDecoder().decode(pt));}
  function showLock(on){document.getElementById("lockwrap").hidden=!on;app.hidden=on;}
  function renderLock(){
    const w=document.getElementById("lockwrap");w.textContent="";
    const box=document.createElement("div");box.className="lock";
    const t=document.createElement("h1");t.textContent="2027 Revenue Tracker";
    const p=document.createElement("p");p.textContent="Enter the 4-digit PIN to view this page.";
    const i=document.createElement("input");i.type="password";i.inputMode="numeric";i.maxLength=4;i.autocomplete="off";i.setAttribute("aria-label","PIN");
    const b=document.createElement("button");b.type="button";b.className="primary";b.textContent="Unlock";
    const e=document.createElement("p");e.className="err";e.setAttribute("role","alert");
    let busy=false;
    const go=async()=>{if(busy)return;const v=i.value.trim();if(!/^\d{4}$/.test(v)){e.textContent="Enter all 4 digits.";return;}
      busy=true;b.disabled=true;b.textContent="Unlocking…";e.textContent="";
      const ok=await tryUnlock(v);
      if(!ok){await new Promise(r=>setTimeout(r,600));e.textContent="That PIN isn’t right. Try again.";i.value="";i.focus();}
      busy=false;b.disabled=false;b.textContent="Unlock";};
    b.addEventListener("click",go);i.addEventListener("keydown",ev=>{if(ev.key==="Enter")go();});
    i.addEventListener("input",()=>{i.value=i.value.replace(/\D/g,"").slice(0,4);if(i.value.length===4)go();});
    box.append(t,p,i,b,e);w.append(box);setTimeout(()=>i.focus(),50);
  }
  async function tryUnlock(p){
    try{const d=await decryptData(encPayload,p);pin=p;try{sessionStorage.setItem(PIN_STORE,p);}catch(e){}
      applyLoaded(d);showLock(false);renderPinbox();render();return true;}
    catch(e){return false;}
  }
  async function receive(d){
    if(isEnc(d)){encPayload=d;
      let sp="";try{sp=sessionStorage.getItem(PIN_STORE)||"";}catch(e){}
      if(pin&&await tryUnlock(pin))return;
      if(sp&&sp!==pin&&await tryUnlock(sp))return;
      pin=null;renderLock();showLock(true);
    }else{encPayload=null;applyLoaded(d);showLock(false);}
    renderPinbox();
  }
  function renderPinbox(){
    const pb=document.getElementById("pinbox");if(!pb)return;pb.textContent="";
    const mk=(tag,props)=>Object.assign(document.createElement(tag),props||{});
    if(pin&&!pinOpen&&!pendingPin){
      const s=mk("span",{textContent:"The numbers are locked with a PIN."});
      const b=mk("button",{type:"button",className:"linkbtn",textContent:"Change PIN"});
      b.addEventListener("click",()=>{pinOpen=true;renderPinbox();});
      pb.append(s,b);return;
    }
    if(pendingPin&&!pinOpen){
      const s=mk("span",{textContent:"New PIN is ready. Click Save to lock the numbers with it."});
      const b=mk("button",{type:"button",className:"linkbtn",textContent:"Undo"});
      b.addEventListener("click",()=>{pendingPin=null;renderPinbox();render();});
      pb.append(s,b);return;
    }
    const p=mk("p",{textContent:pin?"Choose a new 4-digit PIN. Everyone who views the page will need the new PIN.":"Set a 4-digit PIN. Visitors will need it to see the numbers."});
    const row=mk("div",{className:"pinrow"});
    const a=mk("input",{type:"password",inputMode:"numeric",maxLength:4,autocomplete:"new-password",placeholder:"PIN"});a.setAttribute("aria-label","New PIN");
    const c=mk("input",{type:"password",inputMode:"numeric",maxLength:4,autocomplete:"new-password",placeholder:"Repeat"});c.setAttribute("aria-label","Repeat new PIN");
    const b=mk("button",{type:"button",className:"primary",textContent:"Use this PIN"});
    const e=mk("span",{className:"status dirty"});
    b.addEventListener("click",()=>{if(!/^\d{4}$/.test(a.value)){e.textContent="The PIN must be exactly 4 digits.";return;}
      if(a.value!==c.value){e.textContent="The two PINs don’t match.";return;}
      pendingPin=a.value;pinOpen=false;renderPinbox();render();});
    row.append(a,c,b);
    if(pin){const x=mk("button",{type:"button",className:"linkbtn",textContent:"Cancel"});x.addEventListener("click",()=>{pinOpen=false;renderPinbox();});row.append(x);}
    row.append(e);pb.append(p,row);
  }
  function applyLoaded(d){const c=clean(d);if(JSON.stringify(state)===savedJSON){state=JSON.parse(JSON.stringify(c));}savedJSON=JSON.stringify(c);fillInputs();}
  function explain(status){
    if(status===401)return "GitHub didn’t accept the key. It may be mistyped or expired. Remove it and paste a new one.";
    if(status===403||status===404)return "The key can’t write to "+REPO+". Check it has access to this repository with Contents set to Read and write.";
    if(status===409||status===422)return "The numbers changed on GitHub since this page loaded. Reload the page and enter your changes again.";
    return "Couldn’t save to GitHub (error "+status+"). Check your connection and try again.";
  }
  async function load(){
    loading=true;render();
    try{
      if(editing&&getKey()){
        const r=await api(DATA_PATH+"?ref=main&t="+Date.now(),{cache:"no-store"});
        if(r.ok){const j=await r.json();await receive(JSON.parse(b64dec(j.content)));}
        else{msg=explain(r.status);const r2=await fetch(DATA_PATH+"?t="+Date.now(),{cache:"no-store"});if(r2.ok)await receive(await r2.json());}
      }else{
        const r=await fetch(DATA_PATH+"?t="+Date.now(),{cache:"no-store"});
        if(r.ok)await receive(await r.json());
      }
    }catch(e){}
    loading=false;render();
  }
  async function save(){
    const usePin=pendingPin||pin;
    if(!getKey()||saving||!usePin)return;
    saving=true;msg="";render();
    const out=JSON.parse(JSON.stringify(state));out.updated=new Date().toISOString();
    try{
      let sha;
      const g=await api(DATA_PATH+"?ref=main&t="+Date.now(),{cache:"no-store"});
      if(g.ok){sha=(await g.json()).sha;}else if(g.status!==404){msg=explain(g.status);saving=false;render();return;}
      const env=await encryptData(out,usePin);
      const body={message:"Update revenue numbers",content:b64enc(JSON.stringify(env,null,2)+"\n"),branch:"main"};
      if(sha)body.sha=sha;
      const p=await api(DATA_PATH,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(p.ok){state=out;savedJSON=JSON.stringify(out);pin=usePin;pendingPin=null;encPayload=env;try{sessionStorage.setItem(PIN_STORE,usePin);}catch(e){}renderPinbox();msg="Saved. The public page shows the new numbers within about a minute.";setTimeout(()=>{msg="";render();},8000);}
      else{msg=explain(p.status);}
    }catch(e){msg="Couldn’t reach GitHub. Check your connection and try again.";}
    saving=false;render();
  }
  function renderKeybox(){
    const kb=document.getElementById("keybox");if(!kb)return;
    kb.textContent="";
    if(getKey()){
      const s=document.createElement("span");s.textContent="Saving to GitHub is set up on this browser.";
      const b=document.createElement("button");b.className="linkbtn";b.type="button";b.textContent="Remove key";
      b.addEventListener("click",()=>{if(confirm("Remove the GitHub key from this browser? You’ll need to paste it again to save.")){setKey("");msg="";renderKeybox();render();}});
      kb.append(s,b);
    }else{
      const p=document.createElement("p");p.textContent="To save, paste your GitHub key for "+REPO+". It stays in this browser only and is never added to the public page.";
      const i=document.createElement("input");i.type="password";i.autocomplete="off";i.placeholder="github_pat_…";i.setAttribute("aria-label","GitHub key");
      const b=document.createElement("button");b.type="button";b.className="primary";b.textContent="Use this key";
      b.addEventListener("click",()=>{const k=i.value.trim();if(!k)return;setKey(k);msg="";renderKeybox();load();});
      kb.append(p,i,b);
    }
  }
  document.getElementById("save").addEventListener("click",save);
  document.getElementById("discard").addEventListener("click",()=>{state=JSON.parse(savedJSON);pendingPin=null;pinOpen=false;renderPinbox();msg="";fillInputs();render();});
  window.addEventListener("beforeunload",e=>{if(editing&&(JSON.stringify(state)!==savedJSON||pendingPin)){e.preventDefault();e.returnValue="";}});
  window.addEventListener("resize",()=>drawChart(targets()));

  if(!editing){document.querySelectorAll("input.num").forEach(i=>{i.readOnly=true;i.tabIndex=-1;i.placeholder="";});}
  // View counting (GoatCounter). Skipped in #edit mode so the owner's edit sessions aren't counted.
  if(!editing){const gc=document.createElement("script");gc.async=true;gc.src="https://gc.zgo.at/count.js";gc.setAttribute("data-goatcounter","https://lokiheed.goatcounter.com/count");document.head.appendChild(gc);}
  app.hidden=true;
  fillInputs();renderKeybox();render();load().then(()=>{if(document.getElementById("lockwrap").hidden)app.hidden=false;});
})();
</script>
</body>
</html>
